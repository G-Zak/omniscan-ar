services:
  neo4j:
    image: neo4j:5.13-community
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
    ports:
      - "7474:7474"   
      - "7687:7687"  
    volumes:
      - neo4j-data:/data/databases
      - ./backend/neo4j:/scripts
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474/"]
      interval: 5s
      timeout: 2s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - backend-network

volumes:
  neo4j-data:

networks:
  backend-network:
    driver: bridge