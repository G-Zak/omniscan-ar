# Docker Compose configuration for OmniScan AR backend stack
# Services: FastAPI backend, Neo4j database, YOLOv8 CV service


version: '3.8'

services:
  # Neo4j knowledge graph database
  neo4j:
    image: neo4j:5.13-community
    container_name: omniscan-neo4j
    ports:
      - "7474:7474"  # Web UI
      - "7687:7687"  # Bolt protocol
    environment:
      NEO4J_AUTH: none
      NEO4J_server_memory_heap_max__size: 1024m
    volumes:
      - neo4j-data:/data
      - ./backend/neo4j:/scripts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-network

  # FastAPI backend service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omniscan-backend
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - backend-network

  # YOLOv8 CV inference service
  cv-service:
    build:
      context: ./backend/cv-service
      dockerfile: Dockerfile
    container_name: omniscan-cv-service
    ports:
      - "8002:8000"
    environment:
      YOLOV8_MODEL: yolov8n.pt
      CONFIDENCE_THRESHOLD: 0.6
    networks:
      - backend-network

# Named volumes for persistent data
volumes:
  neo4j-data:
    driver: local

# Shared network for service-to-service communication
networks:
  backend-network:
    driver: bridge