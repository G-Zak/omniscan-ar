version: '3.9'

services:
  neo4j:
    image: neo4j:5.15-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_apoc_export_data_max__buffer__size: 500m
      NEO4J_server.memory.heap.initial_size: 1G
      NEO4J_server.memory.heap.max_size: 1G
    volumes:
      - neo4j-data:/data
    networks:
      - omniscan-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - omniscan-net
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password

  cv-service:
    build:
      context: ./cv-service
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    depends_on:
      - api
    networks:
      - omniscan-net
    environment:
      API_URL: http://api:8080

volumes:
  neo4j-data:

networks:
  omniscan-net:
    driver: bridge
